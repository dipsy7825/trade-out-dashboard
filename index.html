document.getElementById('f').onsubmit=async function(e){
e.preventDefault();
var pw=document.getElementById('pw').value;
try{
var parts=D.split(':');
var salt=Uint8Array.from(parts[0].match(/.{2}/g).map(function(b){return parseInt(b,16)}));
var iv=Uint8Array.from(parts[1].match(/.{2}/g).map(function(b){return parseInt(b,16)}));
var enc=parts.slice(2).join(':');
var keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},keyMaterial,{name:'AES-CBC',length:256},false,['decrypt']);
var raw=Uint8Array.from(atob(enc),function(c){return c.charCodeAt(0)});
var dec=await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},key,raw);
var html=new TextDecoder().decode(dec);
document.open();document.write(html);document.close();
}catch(x){document.getElementById('err').style.display='block'}
};
</script>
