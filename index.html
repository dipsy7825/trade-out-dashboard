<html lang="en">
<head>
<meta charset="utf-8">

<title>EastSky Trade-Out Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-box{background:#16213e;padding:40px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.3);text-align:center;max-width:400px;width:90%}

.subtitle{color:#a0a0b0;margin-bottom:24px;font-size:.9em}
input[type=password]{width:100%;padding:12px 16px;border:2px solid #333;border-radius:8px;background:#0f3460;color:#fff;font-size:1em;margin-bottom:16px;outline:none}
input:focus{border-color:#e94560}
button{width:100%;padding:12px;background:#e94560;color:#fff;border:none;border-radius:8px;font-size:1em;cursor:pointer;font-weight:600}
button:hover{background:#c73e54}
.error{color:#e94560;margin-top:12px;display:none;font-size:.9em}
</style>

async function decrypt(e){
e.preventDefault();
var pw=document.getElementById("pw").value;
try{
var salt=Uint8Array.from(atob(SALT),c=>c.charCodeAt(0));
var iv=Uint8Array.from(atob(IV),c=>c.charCodeAt(0));
var ct=Uint8Array.from(atob(CT),c=>c.charCodeAt(0));
var enc=new TextEncoder();
var keyMaterial=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits","deriveKey"]);
var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},keyMaterial,{name:"AES-CBC",length:256},false,["decrypt"]);
var dec=await crypto.subtle.decrypt({name:"AES-CBC",iv:iv},key,ct);
var html=new TextDecoder().decode(dec);
document.open();document.write(html);document.close();
}catch(x){
document.getElementById("err").style.display="block";
document.getElementById("pw").value="";
document.getElementById("pw").focus();
}
return false;
}
</script>
