<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a1628;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#e0e6ed}
.container{background:rgba(15,25,50,0.95);border:1px solid rgba(100,149,237,0.2);border-radius:16px;padding:48px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
h1{font-size:1.3em;margin-bottom:8px;color:#6495ED}
.subtitle{color:#8899aa;font-size:0.85em;margin-bottom:32px}
input{width:100%;padding:14px 18px;border:1px solid rgba(100,149,237,0.3);border-radius:8px;background:rgba(10,20,40,0.8);color:#e0e6ed;font-size:1em;outline:none;transition:border-color 0.2s}
input:focus{border-color:#6495ED}
button{width:100%;padding:14px;border:none;border-radius:8px;background:linear-gradient(135deg,#2c5aa0,#6495ED);color:#fff;font-size:1em;font-weight:600;cursor:pointer;margin-top:16px;transition:opacity 0.2s}
button:hover{opacity:0.9}
.error{color:#e74c3c;font-size:0.85em;margin-top:12px;display:none}
.logo{font-size:2em;margin-bottom:16px}
</style>
